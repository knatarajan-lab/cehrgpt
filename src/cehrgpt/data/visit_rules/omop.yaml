# Visit rules of a dataset made from OMOP, whose events carry a visit_id: the events of a visit are the ones with its id.
#
# The visit is the event whose code is in the Visit vocabulary (Visit/IP, Visit/OP, Visit/ER, Visit/ERIP, ...). Its time
# is the start of the visit and its end the end time of the event. An inpatient or ED visit ends at its discharge event.
# The discharge events are the discharged_to concepts of the visits (a CMS place of service, a NUCC specialty, ...).
#
# Checked on an OMOP sample of 713 persons and 5,498 visits (made with meds_etl.omop and with omop_to_meds.py): the
# discharge codes of that data are all in the list below. A visit whose concept is not in the Visit vocabulary (a CMS
# place of service, a NUCC specialty) has no Visit/ event: its own code is its type.
#
# Write the discharge event at the end of the visit, from a table that is not the visit table. Written at the start of the
# visit, from the visit table, its code sorts before "Visit/" and is taken for the type of the visit.
#
# The time of an event is the ground truth. An event with the id of a visit that is more than a day before its start or
# after its end (a problem list entry from years ago, a drug recorded long after) is taken out of the visit and put where
# its own time is.
#
# Declare it in <meds_reader database>/metadata/visit_rules.yaml, or pass --meds_visit_rules_file omop.
strategy: visit_id
visit_events:
- Visit/
ed_admission_events:
- Visit/ER
admission_events:
- Visit/IP
- Visit/ERIP
- CMS Place of Service/51
- CMS Place of Service/61
discharge_events:
- PCORNet/Generic-NI
- CMS Place of Service/12
- SNOMED/371827001
- CMS Place of Service/21
- NUCC/261Q00000X
- CMS Place of Service/31
- SNOMED/397709008
- Medicare Specialty/A4
- SNOMED/225928004
- CMS Place of Service/34
- CMS Place of Service/61
- CMS Place of Service/51
- CMS Place of Service/23
- PCORNet/Generic-OT
- CMS Place of Service/27
- CMS Place of Service/24
- CMS Place of Service/09
- CMS Place of Service/33
- SNOMED/34596002
- CMS Place of Service/25
- CMS Place of Service/32
- CMS Place of Service/20
