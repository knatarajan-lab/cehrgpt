# Standard event roles recognized in converted MEDS datasets. The inline annotation on every concept identifies the
# data format that emits it. Dataset and user YAML files add source-specific patterns to these defaults.

visit_events:
- Visit/ # OMOP MEDS

ed_admission_events:
- Visit/ER # OMOP MEDS
- ED_REGISTRATION # MIMIC-IV MEDS (MEDS_transforms)
- TRANSFER_TO//ED # MIMIC-IV MEDS (MEDS_transforms)

admission_events:
- Visit/IP # OMOP MEDS
- Visit/ERIP # OMOP MEDS
- CMS Place of Service/51 # OMOP MEDS
- CMS Place of Service/61 # OMOP MEDS
- HOSPITAL_ADMISSION// # MIMIC-IV MEDS (MEDS_transforms)

discharge_events:
- HOSPITAL_DISCHARGE// # MIMIC-IV MEDS (MEDS_transforms)
- PCORNet/Generic-NI # OMOP MEDS
- CMS Place of Service/12 # OMOP MEDS
- SNOMED/371827001 # OMOP MEDS
- CMS Place of Service/21 # OMOP MEDS
- NUCC/261Q00000X # OMOP MEDS
- CMS Place of Service/31 # OMOP MEDS
- SNOMED/397709008 # OMOP MEDS
- Medicare Specialty/A4 # OMOP MEDS
- SNOMED/225928004 # OMOP MEDS
- CMS Place of Service/34 # OMOP MEDS
- CMS Place of Service/61 # OMOP MEDS
- CMS Place of Service/51 # OMOP MEDS
- CMS Place of Service/23 # OMOP MEDS
- PCORNet/Generic-OT # OMOP MEDS
- CMS Place of Service/27 # OMOP MEDS
- CMS Place of Service/24 # OMOP MEDS
- CMS Place of Service/09 # OMOP MEDS
- CMS Place of Service/33 # OMOP MEDS
- SNOMED/34596002 # OMOP MEDS
- CMS Place of Service/25 # OMOP MEDS
- CMS Place of Service/32 # OMOP MEDS
- CMS Place of Service/20 # OMOP MEDS

text_events:
- code: Blood Pressure # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - Systolic Blood Pressure # MIMIC-IV MEDS derived concept
  - Diastolic Blood Pressure # MIMIC-IV MEDS derived concept
- code: Blood Pressure Lying # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - Systolic Blood Pressure Lying # MIMIC-IV MEDS derived concept
  - Diastolic Blood Pressure Lying # MIMIC-IV MEDS derived concept
- code: Blood Pressure Sitting # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - Systolic Blood Pressure Sitting # MIMIC-IV MEDS derived concept
  - Diastolic Blood Pressure Sitting # MIMIC-IV MEDS derived concept
- code: Blood Pressure Standing (1 min) # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - Systolic Blood Pressure Standing (1 min) # MIMIC-IV MEDS derived concept
  - Diastolic Blood Pressure Standing (1 min) # MIMIC-IV MEDS derived concept
- code: Blood Pressure Standing (3 mins) # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - Systolic Blood Pressure Standing (3 mins) # MIMIC-IV MEDS derived concept
  - Diastolic Blood Pressure Standing (3 mins) # MIMIC-IV MEDS derived concept
- code: Weight (Lbs) # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)
  labels:
  - Weight (Lbs) # MIMIC-IV MEDS derived concept
- code: Height (Inches) # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)
  labels:
  - Height (Inches) # MIMIC-IV MEDS derived concept
- code: BMI (kg/m2) # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)
  labels:
  - BMI (kg/m2) # MIMIC-IV MEDS derived concept
- code: LAB//50827//UNK # MIMIC-IV MEDS (MEDS_transforms)
  pattern: (\d+)/(\d+)
  labels:
  - LAB//50827//UNK//1 # MIMIC-IV MEDS derived concept
  - LAB//50827//UNK//2 # MIMIC-IV MEDS derived concept

# A stay that has an admission but no discharge event ends at its last event after this many days without any event
# (in real MIMIC-IV stays, 99.9% of the gaps between event days are under 3.1 days). Days; a stay with a discharge
# event is not affected, however long it is.
max_stay_gap_days: 7
