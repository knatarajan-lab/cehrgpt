[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cehrgpt"
dynamic = ["version"]
authors = [
    { name = "Chao Pang", email = "chaopang229@gmail.com" },
    { name = "Xinzhuo Jiang", email = "xj2193@cumc.columbia.edu" },
    { name = "Krishna Kalluri", email = "kk3326@cumc.columbia.edu" },
    { name = "Elise Minto", email = "em3697@cumc.columbia.edu" },
    { name = "Jason Patterson", email = "jp3477@cumc.columbia.edu" },
    { name = "Nishanth Parameshwar Pavinkurve", email = "np2689@cumc.columbia.edu" },
    { name = "Karthik Natarajan", email = "kn2174@cumc.columbia.edu" }
]
description = "CEHR-GPT: Generating Electronic Health Records with Chronological Patient Timelines"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10.0"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]

dependencies = [
    # The conversion of MEDS and OMOP data into patient sequences. TODO: point this at the released package.
    "meds_to_cehr @ git+https://github.com/knatarajan-lab/meds_to_cehr.git",
    # The libraries cehrgpt imports, with the constraints that cehrbert used to impose on them
    "datasets>=2.16.1,<=3.6.0",
    "numpy>=1.24.3",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn==1.4.0",
    "scipy==1.12.0",
    "torch>=2.4.0,<=2.8.0",
    "accelerate>=0.31.0",
    "femr>=0.2.0,<=0.2.4",
    "PyYAML==6.0.1",
    "Jinja2==3.1.3",
    "openai==1.54.3",
    "optuna==4.0.0",
    "transformers==4.44.1",
    "tokenizers==0.19.0",
    "peft==0.10.0",
    "lightgbm",
    "lifelines==0.30.0",
    "polars",
    "tqdm",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pre-commit", "pytest", "pytest-cov", "pytest-subtests", "rootutils", "hypothesis", "black"
]
flash_attn = [
    "flash_attn"
]
# The Spark tools (building OMOP tables, merging datasets, the analyses) and the cohort and pretraining data
# apps of cehrbert_data that the scripts folder calls
spark = [
    "pyspark==3.1.2",
    "cehrbert_data==0.1.1"
]
# The evaluation app of cehrbert that scripts/level_three_evaluation.sh calls
cehrbert = [
    "cehrbert==1.4.9"
]
