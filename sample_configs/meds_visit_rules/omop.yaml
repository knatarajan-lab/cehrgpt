# Visit rules of a MEDS dataset: which events make a visit, an admission, an ED admission and a discharge.
# Written from the rules of MedsToCehrbertOMOP: a dataset made from OMOP with meds_etl, whose events carry a visit_id.
# A dataset declares its rules in <meds_reader database>/metadata/visit_rules.yaml (copy this file into the metadata
# folder of the MEDS dataset before meds_reader_convert). A file passed with --meds_visit_rules_file replaces the keys
# that it has. The codes are regular expressions matched from the start of the code of an event (re.match).
# See cehrgpt/data/meds_visit_rules.py.
strategy: visit_id
visit_events:
- Visit/
ed_admission_events:
- Visit/ER
admission_events:
- Visit/IP
- Visit/ERIP
- CMS Place of Service/51
- CMS Place of Service/61
discharge_events:
- PCORNet/Generic-NI
- CMS Place of Service/12
- SNOMED/371827001
- CMS Place of Service/21
- NUCC/261Q00000X
- CMS Place of Service/31
- SNOMED/397709008
- Medicare Specialty/A4
- SNOMED/225928004
- CMS Place of Service/34
- CMS Place of Service/61
- CMS Place of Service/51
- CMS Place of Service/23
- PCORNet/Generic-OT
- CMS Place of Service/27
- CMS Place of Service/24
- CMS Place of Service/09
- CMS Place of Service/33
- SNOMED/34596002
- CMS Place of Service/25
- CMS Place of Service/32
- CMS Place of Service/20
