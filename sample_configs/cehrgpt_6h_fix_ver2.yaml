# CEHR-GPT comparison model using the same model width, depth, context length,
# and optimization settings as CoMET-S.

tokenizer_name_or_path: "/mnt/ssd2/cp3016/cehrgpt_6h_fix_ver2"
model_name_or_path: "/mnt/ssd2/cp3016/cehrgpt_6h_fix_ver2"
output_dir: "/mnt/ssd2/cp3016/cehrgpt_6h_fix_ver2"

data_folder: "/mnt/ssd2/cp3016/npjDigitalMedicine/cehrgpt_training_data/patient_sequence/train"
test_data_folder: "/mnt/ssd2/cp3016/npjDigitalMedicine/cehrgpt_training_data/patient_sequence/test"
dataset_prepared_path: "/mnt/ssd2/cp3016/cehrgpt_6h_fix_ver2/dataset_prepared"

adam_beta2: 0.95
weight_decay: 0.1

validation_split_percentage: 0.05
validation_split_num: 1000
preprocessing_num_workers: 16
preprocessing_batch_size: 5000
streaming: false
drop_long_sequences: false

vocab_size: 50000
min_frequency: 100
apply_entropy_filter: false
min_prevalence: 0.0000

do_train: true
overwrite_output_dir: false
seed: 42

dataloader_num_workers: 16
dataloader_prefetch_factor: 8

evaluation_strategy: "epoch"
save_strategy: "epoch"

learning_rate: 0.0002
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1
num_train_epochs: 20

sample_packing: true
max_tokens_per_batch: 16384
use_early_stopping: true
early_stopping_threshold: 0.001

bf16: true
force_attn_implementation: "flash_attention_2"

# ---- architecture: CEHR-GPT ----
# Keep 6 x 768 and the 2048-token context for a controlled CoMET-S comparison.
backbone: "gpt2"
hidden_size: 768
n_head: 12
num_hidden_layers: 6
max_position_embeddings: 2048
decoder_mlp: "GPT2MLP"
inner_dim: 3072
activation_function: "gelu_new"
resid_pdrop: 0.3
embd_pdrop: 0.3
attn_pdrop: 0.3

# Replace only recognized time-token input embeddings. Change to "concept" for
# the legacy CEHR-GPT baseline using the ordinary concept embedding table.
time_token_embedding_type: "sinusoidal"
sinusoidal_time_base: 10000.0

# Retained for runner/config compatibility. Current CEHR-GPT model construction
# removes exclude_position_ids before creating CEHRGPTConfig.
exclude_position_ids: true
apply_rotary: false
include_values: false

use_sub_time_tokenization: false
include_ttv_prediction: false

motor_use_ontology: false
vocab_dir: "/mnt/ssd2/ohdsi_cumc_deid_2023q4r3_cleaned_corrected/"

shuffle_records: false

warmup_ratio: 0.05
logging_dir: "./logs"
logging_steps: 1
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

report_to: "none"
